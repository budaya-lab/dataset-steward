name: Validate steward

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Install locked dependencies without source builds
        run: uv sync --locked --no-build
      - name: Test Python
        run: uv run --locked python -B -m unittest discover -p 'test_*.py'
      - name: Test JavaScript
        run: node --test static/*.test.mjs
      - name: Check JavaScript syntax
        run: node --check static/app.js
