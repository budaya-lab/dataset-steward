<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dataset Descriptions</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="layout">
    <main id="main">
      <p class="empty">Select a dataset from the list.</p>
    </main>
    <aside class="panel" aria-label="Datasets">
      <div class="panel-head">
        <h2>Datasets</h2>
        <button type="button" id="revalidate" class="secondary">Re-validate</button>
      </div>
      <p id="summary" class="muted"></p>
      <ul id="dataset-list" class="dataset-list"></ul>
    </aside>
  </div>
  <div id="tooltip" class="tooltip" role="status" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
